  <style>
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(1100px 520px at 50% -8%, rgba(249,115,22,0.10), transparent 70%),
        radial-gradient(900px 500px at 110% 110%, rgba(34,211,238,0.05), transparent 70%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 90px),
        #0A0C12;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(249,115,22,0.4); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222938; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #2E3850; }

    @keyframes pop      { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shakeX   { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
    @keyframes throwIn  { 0% { transform: translateY(-14px) scale(0.92); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes bustFlash{ 0% { opacity: 0.85; } 100% { opacity: 0; } }
    @keyframes confetti { 0% { transform: translateY(-6vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(112vh) rotate(740deg); opacity: 0.85; } }
    @keyframes glowPulse{ 0%,100% { filter: drop-shadow(0 0 4px rgba(249,115,22,0.7)); } 50% { filter: drop-shadow(0 0 16px rgba(249,115,22,1)); } }
    @keyframes riseFade { 0% { transform: translateY(8px); opacity: 0; } 12% { transform: translateY(0); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

    .animate-pop       { animation: pop 0.35s cubic-bezier(.2,1.4,.4,1) both; }
    .animate-shakeX    { animation: shakeX 0.4s ease both; }
    .animate-throwIn   { animation: throwIn 0.3s ease both; }
    .animate-bustFlash { animation: bustFlash 0.9s ease-out both; }
    .animate-glowPulse { animation: glowPulse 1.4s ease-in-out infinite; }
    .animate-riseFade  { animation: riseFade 2.6s ease both; }

    .ring-progress { transition: stroke-dashoffset 0.9s cubic-bezier(.3,1,.3,1); }
    .ball-travel   { transition: transform 0.9s cubic-bezier(.3,1.2,.35,1); }
    .tabular       { font-variant-numeric: tabular-nums; }
  </style>
</head>

-- ---------------------------------------------------------------
-- Hoop Darts player database (SQLite dialect)
-- Canonical dataset for the game. index.html embeds a copy of this
-- file and loads it into sql.js (SQLite/WASM) at startup; run
-- `node tools/inject-data.mjs` after editing to re-embed it.
-- Stat values are close approximations, tuned for gameplay.
-- ---------------------------------------------------------------
CREATE TABLE categories (
  key  TEXT PRIMARY KEY,
  name TEXT NOT NULL
);
CREATE TABLE players (
  id          INTEGER PRIMARY KEY,
  name        TEXT NOT NULL UNIQUE,
  search_name TEXT NOT NULL UNIQUE
);
CREATE TABLE player_stats (
  player_id INTEGER NOT NULL REFERENCES players(id),
  category  TEXT    NOT NULL REFERENCES categories(key),
  value     INTEGER NOT NULL,
  PRIMARY KEY (player_id, category)
);
CREATE INDEX idx_players_search ON players(search_name);
CREATE INDEX idx_stats_player   ON player_stats(player_id);

    function parseSqlDataset(sql) {
      const players = new Map(); // search_name -> display name
      const byId = new Map();    // id -> search_name
      const stats = new Map();   // search_name -> { category: value }
      const [head, statSec] = sql.split('-- @stats');
      const playerSec = head.split('-- @players')[1] || '';
      const playerRe = /\((\d+),'((?:[^']|'')*)','((?:[^']|'')*)'\)/g;
      const statRe = /\((\d+),'([a-z0-9]+)',(\d+)\)/g;
      let m;
      while ((m = playerRe.exec(playerSec))) {
        const name = m[2].replace(/''/g, "'");
        const sn = m[3].replace(/''/g, "'");
        players.set(sn, name);
        byId.set(+m[1], sn);
      }
      while ((m = statRe.exec(statSec || ''))) {
        const sn = byId.get(+m[1]);
        if (!sn) continue;
        if (!stats.has(sn)) stats.set(sn, {});
        stats.get(sn)[m[2]] = +m[3];
      }
      return { players, stats };
    }

    function makeMemoryBackend({ players, stats }) {
      const list = [...players.entries()].map(([sn, name]) => ({ sn, name }));
      return {
        engine: 'in-memory fallback',
        count: list.length,
        search(nq, limit = 8) {
          if (!nq) return [];
          const starts = [];
          const contains = [];
          for (const p of list) {
            if (p.sn.startsWith(nq)) starts.push(p.name);
            else if (p.sn.includes(nq)) contains.push(p.name);
          }
          return [...starts, ...contains].slice(0, limit);
        },
        find(nq) { return players.get(nq) || null; },
        getStat(nq, cat) { const s = stats.get(nq); return s ? (s[cat] || 0) : 0; },
      };
    }

    function makeSqliteBackend(db) {
      const all = (sql, params) => {
        const stmt = db.prepare(sql);
        stmt.bind(params);
        const rows = [];
        while (stmt.step()) rows.push(stmt.get());
        stmt.free();
        return rows;
      };
      return {
        engine: 'SQLite via sql.js',
        count: all('SELECT COUNT(*) FROM players')[0][0],
        search(nq, limit = 8) {
          if (!nq) return [];
          return all(
            'SELECT name FROM players WHERE search_name LIKE $c ' +
            'ORDER BY (search_name LIKE $p) DESC, search_name LIMIT $n',
            { $c: '%' + nq + '%', $p: nq + '%', $n: limit }
          ).map((r) => r[0]);
        },
        find(nq) {
          const r = all('SELECT name FROM players WHERE search_name = $n', { $n: nq });
          return r.length ? r[0][0] : null;
        },
        getStat(nq, cat) {
          const r = all(
            'SELECT ps.value FROM player_stats ps JOIN players p ON p.id = ps.player_id ' +
            'WHERE p.search_name = $n AND ps.category = $c',
            { $n: nq, $c: cat }
          );
          return r.length ? r[0][0] : 0;
        },
      };
    }

    let DBI = null;
    async function initDB() {
      if (DBI) return DBI;
      const sqlText = getSqlText();
      try {
        if (typeof initSqlJs !== 'function') throw new Error('sql.js script not loaded');
        const SQL = await initSqlJs({ locateFile: (f) => SQL_CDN + f });
        const db = new SQL.Database();
        db.run(sqlText);
        DBI = makeSqliteBackend(db);
      } catch (e) {
        DBI = makeMemoryBackend(parseSqlDataset(sqlText));
      }
      return DBI;
    }

    /* ------------------------------------------------------------------ */
    /* Utilities                                                           */
    /* ------------------------------------------------------------------ */
    function norm(s) {
      return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, '').trim();
    }

    const findPlayer = (name) => (DBI ? DBI.find(norm(name)) : null);

    const todayKey = () => new Date().toISOString().slice(0, 10);

    const hashStr = (s) => {
      let h = 7;
      for (let i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) % 1000003;
      return h;
    };
    const dailyCategoryIdx = () => hashStr(todayKey()) % CATEGORIES.length;

    const throwEmoji = (h) => {
      if (h.bust) return '❌';
      if (h.raw > 0 && h.value === 0) return '🚫';
      if (h.value >= 100) return '🔥';
      if (h.value >= 50) return '🏀';
      if (h.value >= 25) return '🎯';
      if (h.value >= 10) return '🟧';
      if (h.value >= 1) return '🟠';
      return '🧱';
    };

    const makePlayer = (name) => ({ name, score: START_SCORE, lives: MAX_LIVES, history: [] });

    const freshState = (names) => ({
      players: names.map(makePlayer),
      turn: 0,
      used: [],
      status: 'playing', // 'playing' | 'over'
      winner: null,      // player index on win, null = solo loss (or unfinished)
      perfect: false,
    });

    const loadDaily = () => {
      try {
        const raw = localStorage.getItem(DAILY_PREFIX + todayKey());
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || data.v !== 1 || !data.state || !Array.isArray(data.state.players)) return null;
        return data;
      } catch (e) {
        return null;
      }
    };

    const saveDaily = (catIdx, state) => {
      try {
        localStorage.setItem(DAILY_PREFIX + todayKey(), JSON.stringify({ v: 1, catIdx, state }));
      } catch (e) { /* storage unavailable — daily just won't persist */ }
    };

    const copyToClipboard = (text) => {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          resolve();
        } catch (err) {
          reject(err);
        } finally {
          document.body.removeChild(ta);
        }
      });
    };

    const buildShareText = ({ mode, cat, state }) => {
      const lines = [`🏀 HOOP DARTS — ${cat.name}`];
      if (mode === 'daily') lines.push(`📅 Daily Challenge · ${todayKey()}`);
      state.players.forEach((pl, i) => {
        const grid = pl.history.map(throwEmoji).join('') || '⬜';
        let tail = '';
        if (state.status === 'over') {
          if (state.winner === i) tail = state.perfect ? ' 💯🏆' : ' 🏆';
          else if (state.players.length === 1) tail = ' 💀';
        }
        const label = state.players.length > 1 ? `${pl.name}: ` : '';
        lines.push(`${label}${grid}${tail}`);
        lines.push(`${label ? '   ' : ''}${pl.history.length} throws · finished at ${pl.score}`);
      });
      if (state.perfect) lines.push('PERFECT CHECKOUT — exactly zero! 🎯');
      lines.push('Play Hoop Darts: 501 → 0, NBA style.');
      return lines.join('\n');
    };

    /* ------------------------------------------------------------------ */

    const CONFETTI_COLORS = ['#F97316', '#FDBA74', '#22D3EE', '#FACC15', '#F8FAFC', '#34D399'];

    function Confetti() {
      const pieces = useMemo(
        () =>
          Array.from({ length: 90 }, (_, i) => ({
            id: i,
            left: Math.random() * 100,
            delay: Math.random() * 2.2,
            dur: 2.6 + Math.random() * 2.4,
            size: 6 + Math.random() * 9,
            color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
            round: Math.random() > 0.5,
          })),
        []
      );
      return (
        <div className="pointer-events-none fixed inset-0 z-[70] overflow-hidden" aria-hidden="true">
          {pieces.map((c) => (
            <div
              key={c.id}
              className="absolute top-0"
              style={{
                left: c.left + '%',
                width: c.size + 'px',
                height: c.size * (c.round ? 1 : 0.45) + 'px',
                backgroundColor: c.color,
                borderRadius: c.round ? '9999px' : '2px',
                animation: `confetti ${c.dur}s linear ${c.delay}s infinite`,
              }}
            />
          ))}
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Court / Hoop visualizer — progress ring + ball arcing to the rim    */
    /* ------------------------------------------------------------------ */
    function CourtVisualizer({ score, bustTick, inCheckoutRange, won }) {
      const progress = Math.min(1, Math.max(0, (START_SCORE - score) / START_SCORE));
      const R = 110;
      const C = 2 * Math.PI * R;
      const dashOffset = C * (1 - progress);

      // Quadratic bezier flight path: bottom-left launch → rim
      const P0 = { x: 52, y: 192 };
      const P1 = { x: -10, y: 96 };
      const P2 = { x: 120, y: 66 };
      const t = won ? 1 : progress;
      const bx = (1 - t) * (1 - t) * P0.x + 2 * (1 - t) * t * P1.x + t * t * P2.x;
      const by = (1 - t) * (1 - t) * P0.y + 2 * (1 - t) * t * P1.y + t * t * P2.y;

      const nearZone = inCheckoutRange && !won;

      return (
        <div className="relative mx-auto w-full max-w-[340px]">
          <svg viewBox="0 0 240 240" className="w-full select-none" role="img" aria-label={'Score remaining: ' + score}>
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#F97316" />
                <stop offset="60%" stopColor="#FDBA74" />
                <stop offset="100%" stopColor="#22D3EE" />
              </linearGradient>
              <radialGradient id="ballGrad" cx="35%" cy="30%" r="80%">
                <stop offset="0%" stopColor="#FB923C" />
                <stop offset="70%" stopColor="#EA580C" />
                <stop offset="100%" stopColor="#9A3412" />
              </radialGradient>
            </defs>

            {/* Track ring */}
            <circle cx="120" cy="120" r={R} fill="none" stroke="#1B2130" strokeWidth="9" />

            {/* Progress ring */}
            <g transform="rotate(-90 120 120)">
              <circle
                cx="120" cy="120" r={R}
                fill="none"
                stroke="url(#ringGrad)"
                strokeWidth="9"
                strokeLinecap="round"
                strokeDasharray={C}
                strokeDashoffset={dashOffset}
                className={'ring-progress' + (nearZone ? ' animate-glowPulse' : '')}
              />
            </g>

            {/* Backboard */}
            <rect x="90" y="26" width="60" height="40" rx="4" fill="#11151F" stroke="#3A4358" strokeWidth="2" />
            <rect x="106" y="42" width="28" height="20" rx="2" fill="none" stroke="#3A4358" strokeWidth="2" />

            {/* Rim + net */}
            <ellipse cx="120" cy="70" rx="21" ry="5.5" fill="none" stroke={won ? '#34D399' : '#F97316'} strokeWidth="3.5" />
            <path d="M101 73 L108 96 M139 73 L132 96 M110 72.5 L114 96 M130 72.5 L126 96 M108 96 Q120 102 132 96"
                  fill="none" stroke="#46506A" strokeWidth="1.4" strokeLinecap="round" />

            {/* Basketball travelling along the arc */}
            <g className="ball-travel" style={{ transform: `translate(${bx}px, ${by}px)` }}>
              <circle r="11" fill="url(#ballGrad)" stroke="#7C2D12" strokeWidth="1.5" />
              <path d="M-11 0 H11 M0 -11 V11 M-7.8 -7.8 Q0 -2 7.8 -7.8 M-7.8 7.8 Q0 2 7.8 7.8"
                    fill="none" stroke="#7C2D12" strokeWidth="1.3" />
            </g>

            {/* Score readout */}
            <text x="120" y="158" textAnchor="middle" className="font-score tabular"
                  fontSize="58" fill={won ? '#34D399' : '#F8FAFC'} style={{ letterSpacing: '2px' }}>
              {score}
            </text>
            <text x="120" y="178" textAnchor="middle" fontSize="9.5" fill="#64748B"
                  style={{ letterSpacing: '3px', fontWeight: 700 }}>
              {won ? 'CHECKED OUT' : 'REMAINING'}
            </text>
            {nearZone && (
              <text x="120" y="196" textAnchor="middle" fontSize="9" fill="#FDBA74"
                    style={{ letterSpacing: '2px', fontWeight: 700 }}>
                CHECKOUT RANGE — FINISH IT
              </text>
            )}
          </svg>

          {/* Bust flash overlay */}
          {bustTick > 0 && (
            <div key={bustTick}
                 className="animate-bustFlash pointer-events-none absolute inset-0 flex items-center justify-center rounded-full bg-red-600/40">
              <span className="font-score text-6xl tracking-widest text-red-100 drop-shadow-lg">BUST!</span>
            </div>
          )}
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Category card                                                       */

    function CategoryCard({ cat, mode }) {
      return (
        <div className="relative overflow-hidden rounded-2xl border border-line bg-panel p-4 shadow-inner2 sm:p-5">
          <div className="pointer-events-none absolute -right-8 -top-8 h-32 w-32 rounded-full bg-court/10 blur-2xl" />

            </div>

                  {mode === 'daily' ? "Today's Category" : 'Active Category'}

                </span>

    function LivesMeter({ lives }) {

    /* ------------------------------------------------------------------ */
    /* Per-player scoreboard panel                                         */
    /* ------------------------------------------------------------------ */
    function PlayerPanel({ player, active, duel, isWinner, gameOver }) {
      const thrown = player.history.filter((h) => !h.bust);
      const avg = thrown.length ? Math.round(thrown.reduce((a, h) => a + h.value, 0) / thrown.length) : 0;
      return (
        <div className={
          'relative flex-1 rounded-2xl border p-3 transition-all sm:p-4 ' +
          (active && !gameOver
            ? 'border-court/60 bg-panel2 shadow-glow'
            : 'border-line bg-panel opacity-90')
        }>
          {active && !gameOver && duel && (
            <span className="absolute -top-2.5 left-3 rounded-full bg-court px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-widest text-ink">
              On the line
            </span>
          )}
          {gameOver && isWinner && (
            <span className="absolute -top-2.5 left-3 flex items-center gap-1 rounded-full bg-emerald-400 px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-widest text-ink">
              <Crown size={11} /> Winner
            </span>

          <div className="flex items-center justify-between gap-2">
            <p className="truncate text-xs font-bold uppercase tracking-wider text-slate-400">{player.name}</p>
            <LivesMeter lives={player.lives} />
          </div>
          <p className={'font-score tabular text-5xl leading-none tracking-wide sm:text-6xl ' +
            (player.score <= 0 ? 'text-emerald-400' : active && !gameOver ? 'text-white' : 'text-slate-300')}>
            {player.score}
          </p>
          <div className="mt-1.5 flex items-center gap-3 text-[11px] text-slate-500">
            <span className="tabular">{player.history.length} throws</span>
            <span className="tabular">avg {avg}</span>
            {player.score > 0 && player.score <= MAX_VISIT && (
              <span className="font-semibold text-court-glow">checkout live</span>
            )}
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Autocomplete search                                                 */
    /* ------------------------------------------------------------------ */
    function PlayerSearch({ onGuess, used, disabled, placeholder }) {
      const [q, setQ] = useState('');
      const [hi, setHi] = useState(0);
      const [focus, setFocus] = useState(false);
      const [shake, setShake] = useState(0);
      const inputRef = useRef(null);

      // Live database query on every keystroke
      const sugg = useMemo(() => (DBI ? DBI.search(norm(q), 8) : []), [q]);

      useEffect(() => { setHi(0); }, [q]);

      const fire = (name) => {
        const ok = onGuess(name);
        if (ok) {
          setQ('');
          if (inputRef.current) inputRef.current.focus();
        } else {
          setShake((s) => s + 1);
        }
      };

      const submit = () => {
        if (disabled || !q.trim()) return;
        const exact = findPlayer(q);
        if (exact) return fire(exact);
        const pick = sugg[hi] || sugg[0];
        if (pick) return fire(pick);
        fire(q.trim()); // lets the parent produce a "not in database" message
      };

      const onKeyDown = (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); setHi((h) => Math.min(h + 1, Math.max(sugg.length - 1, 0))); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setHi((h) => Math.max(h - 1, 0)); }
        else if (e.key === 'Enter') { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') { setFocus(false); }
      };

      return (
        <div key={shake} className={'relative ' + (shake ? 'animate-shakeX' : '')}>
          <div className="flex gap-2">
            <div className="relative flex-1">
              <Search size={16} className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500" />
              <input
                ref={inputRef}
                type="text"
                value={q}
                disabled={disabled}
                onChange={(e) => setQ(e.target.value)}
                onFocus={() => setFocus(true)}
                onBlur={() => setTimeout(() => setFocus(false), 120)}
                onKeyDown={onKeyDown}
                placeholder={placeholder}
                autoComplete="off"
                autoCorrect="off"
                spellCheck="false"
                className="w-full rounded-xl border border-line bg-panel2 py-3 pl-10 pr-3 text-sm font-medium text-white placeholder-slate-500 outline-none transition focus:border-court/70 focus:ring-2 focus:ring-court/30 disabled:opacity-40"
                aria-label="Type an NBA player's name"
              />
            </div>
            <button
              onClick={submit}
              disabled={disabled || !q.trim()}
              className="flex items-center gap-1.5 rounded-xl bg-court px-4 py-3 text-sm font-extrabold uppercase tracking-wider text-ink transition hover:bg-court-glow active:scale-95 disabled:opacity-30 disabled:hover:bg-court"
            >
              <Target size={16} /> Throw
            </button>
          </div>

          {focus && sugg.length > 0 && !disabled && (
            <ul className="absolute z-30 mt-2 w-full overflow-hidden rounded-xl border border-line bg-panel2 shadow-2xl shadow-black/50">
              {sugg.map((name, i) => {
                const isUsed = used.includes(name);
                return (
                  <li key={name}>
                    <button
                      onMouseDown={(e) => { e.preventDefault(); fire(name); }}
                      onMouseEnter={() => setHi(i)}
                      className={
                        'flex w-full items-center justify-between px-4 py-2.5 text-left text-sm transition ' +
                        (i === hi ? 'bg-court/15 text-white' : 'text-slate-300') +
                        (isUsed ? ' opacity-40' : '')
                      }
                    >
                      <span className={isUsed ? 'line-through' : ''}>{name}</span>
                      {isUsed
                        ? <span className="text-[10px] font-bold uppercase tracking-widest text-red-400">used</span>
                        : i === hi && <ChevronRight size={14} className="text-court" />}
                    </button>
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Throw history                                                       */
    /* ------------------------------------------------------------------ */
    function HistoryList({ players, duel, catShort }) {
      const rows = [];
      players.forEach((pl, pi) => {
        pl.history.forEach((h, hi) => rows.push({ ...h, by: pl.name, byIdx: pi, seq: hi, key: pi + '-' + hi }));
      });
      // Interleave in true chronological order: sort by per-player sequence, then player index
      rows.sort((a, b) => (a.seq - b.seq) || (a.byIdx - b.byIdx));
      rows.reverse();

      if (rows.length === 0) {
        return (
          <div className="rounded-xl border border-dashed border-line bg-panel/50 px-4 py-6 text-center text-xs text-slate-500">
            No throws yet — name an NBA player to open the scoring.
          </div>
        );
      }
      return (
        <ul className="max-h-64 space-y-1.5 overflow-y-auto pr-1 lg:max-h-80">
          {rows.map((h, idx) => (
            <li key={h.key}
                className={'flex items-center gap-2.5 rounded-lg border px-3 py-2 text-xs sm:text-sm ' +
                  (idx === 0 ? 'animate-throwIn ' : '') +
                  (h.bust ? 'border-red-900/60 bg-red-950/30' : 'border-line bg-panel2/60')}>
              <span className="text-base leading-none">{throwEmoji(h)}</span>
              <div className="min-w-0 flex-1">
                <p className="truncate font-semibold text-slate-200">
                  {duel && <span className="mr-1.5 rounded bg-line px-1.5 py-0.5 text-[10px] font-bold text-slate-400">{h.by}</span>}
                  {h.name}
                </p>
                <p className="truncate text-[11px] text-slate-500">
                  {h.bust
                    ? `would have gone below ${CHECKOUT_MIN} — score reset, life lost`
                    : h.raw > 0 && h.value === 0
                      ? `${h.raw} ${catShort} — impossible darts visit, scores 0`
                      : h.value === 0
                        ? `no tracked ${catShort} — throw burned`
                        : `−${h.value} ${catShort}`}
                </p>
              </div>
              <span className={'tabular shrink-0 font-score text-lg tracking-wide ' + (h.bust ? 'text-red-400' : 'text-court-glow')}>
                {h.bust ? 'BUST' : '→ ' + h.scoreAfter}
              </span>
            </li>
          ))}
        </ul>
      );
    }

    /* ------------------------------------------------------------------ */
    /* End-of-game modal                                                   */
    /* ------------------------------------------------------------------ */
    function StatBox({ label, value, accent }) {
      return (
        <div className="rounded-xl border border-line bg-panel2 p-3 text-center">
          <p className={'font-score tabular text-3xl tracking-wide ' + (accent ? 'text-court-glow' : 'text-white')}>{value}</p>
          <p className="mt-0.5 text-[10px] font-bold uppercase tracking-widest text-slate-500">{label}</p>
        </div>
      );

    function EndModal({ mode, cat, state, onReplay, onExit }) {
      const [copied, setCopied] = useState(false);
      const duel = state.players.length > 1;
      const won = state.winner !== null;
      const hero = state.players[won ? state.winner : 0];
      const finishedAt = hero.score;
      const checkedOut = won && finishedAt <= 0; // duel wins can also come from the opponent busting out
      const loserName = duel && won ? state.players[state.winner === 0 ? 1 : 0].name : null;

      const totalTurns = hero.history.length;
      const best = hero.history.reduce((m, h) => (h.bust ? m : Math.max(m, h.value)), 0);
      const busts = hero.history.filter((h) => h.bust).length;
      const accuracy = checkedOut
        ? (state.perfect ? 100 : Math.max(0, Math.round(((10 - Math.abs(finishedAt)) / 10) * 100)))
        : 0;

      const share = () => {
        copyToClipboard(buildShareText({ mode, cat, state }))
          .then(() => { setCopied(true); setTimeout(() => setCopied(false), 2200); })
          .catch(() => { setCopied(false); });
      };

      return (
        <div className="fixed inset-0 z-[80] flex items-center justify-center bg-ink/85 p-4 backdrop-blur-sm">
          {won && <Confetti />}
          <div className="animate-pop relative w-full max-w-md rounded-3xl border border-line bg-panel p-6 shadow-2xl shadow-black/60">
            <div className="text-center">
              <div className={'mx-auto flex h-16 w-16 items-center justify-center rounded-2xl text-3xl ' +
                (won ? 'bg-court/15' : 'bg-red-500/10')}>
                {won ? (state.perfect ? '💯' : '🏆') : '💀'}
              </div>
              <h2 className="mt-3 font-score text-4xl tracking-wide text-white">
                {won
                  ? state.perfect ? 'PERFECT CHECKOUT!' : (duel ? `${hero.name.toUpperCase()} WINS!` : 'CHECKED OUT!')
                  : 'GAME OVER'}
              </h2>
              <p className="mt-1 text-sm text-slate-400">
                {won
                  ? state.perfect
                    ? 'Exactly zero. Nothing but net. 🎯'
                    : checkedOut
                      ? `Landed at ${finishedAt} — inside the checkout zone (0 to ${CHECKOUT_MIN}).`
                      : `${loserName} busted out of lives — ${hero.name} takes the match.`
                  : 'Out of lives. The rim said no.'}
                {mode === 'daily' && <span className="mt-1 block text-xs text-slate-500">New daily challenge drops tomorrow.</span>}
              </p>

              {state.perfect && (
                <span className="mt-3 inline-flex items-center gap-1.5 rounded-full border border-court/50 bg-court/10 px-3 py-1 text-xs font-extrabold uppercase tracking-widest text-court-glow">
                  <Award size={13} /> Perfect Checkout Badge
                </span>
              )}
            </div>

            <p className="mb-2 mt-5 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">
              {duel ? `${hero.name} — Stats for the Match` : 'Stats for the Match'}
            </p>
            <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
              <StatBox label="Turns" value={totalTurns} />
              <StatBox label="Best Throw" value={best} accent />
              <StatBox label="Busts" value={busts} />
              <StatBox label="Checkout" value={checkedOut ? accuracy + '%' : '—'} accent={checkedOut} />
            </div>

            {duel && (
              <div className="mt-3 space-y-1.5 rounded-xl border border-line bg-panel2/60 p-3">
                {state.players.map((pl, i) => (
                  <div key={i} className="flex items-center justify-between text-xs">
                    <span className={'font-semibold ' + (state.winner === i ? 'text-court-glow' : 'text-slate-400')}>
                      {state.winner === i ? '👑 ' : ''}{pl.name}
                    </span>
                    <span className="tabular text-slate-400">{pl.history.length} throws · finished at {pl.score}</span>
                  </div>
                ))}
              </div>
            )}

            <div className="mt-3 rounded-xl border border-line bg-panel2/60 p-3">
              {state.players.map((pl, i) => (
                <p key={i} className="truncate text-center text-lg leading-relaxed tracking-wider">
                  {pl.history.map(throwEmoji).join('')}{state.winner === i ? (state.perfect ? '💯' : '🏆') : ''}
                </p>
              ))}
            </div>

            <div className="mt-5 flex flex-col gap-2 sm:flex-row">
              <button onClick={share}
                      className="flex flex-1 items-center justify-center gap-2 rounded-xl bg-court px-4 py-3 text-sm font-extrabold uppercase tracking-wider text-ink transition hover:bg-court-glow active:scale-95">
                {copied ? <Check size={16} /> : <Share2 size={16} />}
                {copied ? 'Copied!' : 'Share Results'}
              </button>
              {mode !== 'daily' && (
                <button onClick={onReplay}
                        className="flex flex-1 items-center justify-center gap-2 rounded-xl border border-line bg-panel2 px-4 py-3 text-sm font-extrabold uppercase tracking-wider text-slate-200 transition hover:border-court/50 active:scale-95">
                  <RotateCcw size={16} /> Run It Back
                </button>
              )}
              <button onClick={onExit}
                      className="flex items-center justify-center gap-2 rounded-xl border border-line bg-panel2 px-4 py-3 text-sm font-extrabold uppercase tracking-wider text-slate-400 transition hover:text-white active:scale-95">
                <ArrowLeft size={16} /> Menu
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Game screen                                                         */
    /* ------------------------------------------------------------------ */
    function Game({ config, onExit }) {
      const cat = CATEGORIES[config.catIdx];
      const [state, setState] = useState(() => config.saved || freshState(config.names));
      const [msg, setMsg] = useState(null);            // {t:'err'|'bust'|'good'|'info', text}
      const [lastThrow, setLastThrow] = useState(null); // {id, value, bust}
      const [bustTick, setBustTick] = useState(0);

      const duel = state.players.length > 1;
      const cur = state.players[state.turn];
      const gameOver = state.status === 'over';

      // Daily challenge anti-cheat persistence: every state change is written
      // immediately, so refreshing after a bust restores the busted state.
      useEffect(() => {
        if (config.mode === 'daily') saveDaily(config.catIdx, state);
      }, [state, config.mode, config.catIdx]);

      const guess = useCallback((rawName) => {
        if (state.status !== 'playing') return false;
        const canonical = findPlayer(rawName);
        if (!canonical) {
          setMsg({ t: 'err', text: `“${rawName}” isn't in the database — pick a name from the suggestions.` });
          return false;
        }
        if (state.used.includes(canonical)) {
          setMsg({ t: 'err', text: `${canonical} has already been thrown this game.` });
          return false;
        }

        const i = state.turn;
        const me = state.players[i];
        const raw = DBI.getStat(norm(canonical), cat.key); // live SQL lookup
        const value = visitValue(raw);
        const impossible = raw > 0 && value === 0;
        const newScore = me.score - value;
        const bust = newScore < CHECKOUT_MIN;

        const players = state.players.map((pl) => ({ ...pl, history: [...pl.history] }));
        let status = 'playing';
        let winner = state.winner;
        let perfect = state.perfect;

        if (bust) {
          players[i].lives -= 1;
          players[i].history.push({ name: canonical, value, raw, bust: true, scoreAfter: me.score });
          if (players[i].lives <= 0) {
            status = 'over';
            winner = duel ? (i === 0 ? 1 : 0) : null;
          }
          setBustTick((b) => b + 1);
          setMsg({
            t: 'bust',
            text: `BUST! ${canonical} (−${value}) blows past ${CHECKOUT_MIN}. Score resets to ${me.score} — ${players[i].lives} ${players[i].lives === 1 ? 'life' : 'lives'} left.`,
          });
        } else {
          players[i].score = newScore;
          players[i].history.push({ name: canonical, value, raw, bust: false, scoreAfter: newScore });
          if (newScore <= 0) {
            status = 'over';
            winner = i;
            perfect = newScore === 0;
            setMsg(null);
          } else if (impossible) {
            setMsg({ t: 'info', text: `${canonical}: ${raw} ${cat.short} — not a scoreable darts visit (over ${MAX_VISIT} or a bogey number). Counts as 0.` });
          } else if (value === 0) {
            setMsg({ t: 'info', text: `${canonical} has no tracked ${cat.short} — a brick. Throw burned for 0.` });
          } else if (newScore <= MAX_VISIT) {
            setMsg({ t: 'good', text: `−${value}. You're in throwing distance of the checkout zone (0 to ${CHECKOUT_MIN}).` });
          } else {
            setMsg({ t: 'good', text: `${canonical} drains −${value} ${cat.short}.` });
          }
        }

        const turn = status === 'playing' && duel ? (i + 1) % players.length : i;
        setLastThrow({ id: Date.now(), value, bust });
        setState({ players, turn, used: [...state.used, canonical], status, winner, perfect });
        return true;
      }, [state, cat, duel]);

      const replay = () => {
        setState(freshState(config.names));
        setMsg(null);
        setLastThrow(null);
        setBustTick(0);
      };

      const modeLabel = config.mode === 'daily' ? 'Daily Challenge' : duel ? '1 v 1 Duel' : 'Solo 501';
      const ModeIcon = config.mode === 'daily' ? Calendar : duel ? Swords : User;

      return (
        <div className="mx-auto w-full max-w-5xl px-4 pb-10 pt-4 sm:px-6">
          {/* Header */}
          <header className="mb-4 flex items-center justify-between gap-3">
            <div className="flex items-center gap-2.5">
              <span className="flex h-9 w-9 items-center justify-center rounded-xl bg-court text-lg shadow-glow">🏀</span>
              <div>
                <h1 className="font-score text-2xl leading-none tracking-widest text-white">HOOP DARTS</h1>
                <p className="flex items-center gap-1 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">
                  <ModeIcon size={10} /> {modeLabel}{config.mode === 'daily' ? ' · ' + todayKey() : ''}
                </p>
              </div>
            </div>
            <button onClick={onExit}
                    className="flex items-center gap-1.5 rounded-xl border border-line bg-panel px-3 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 transition hover:text-white">
              <ArrowLeft size={14} /> <span className="hidden sm:inline">Menu</span>
            </button>
          </header>

          <CategoryCard cat={cat} mode={config.mode} />

          <div className="mt-4 grid gap-4 lg:grid-cols-[minmax(0,1fr)_minmax(0,1.15fr)]">
            {/* Left: visualizer */}
            <section className="relative rounded-2xl border border-line bg-panel p-4 shadow-inner2 sm:p-6">
              <CourtVisualizer
                score={cur.score}
                bustTick={bustTick}
                inCheckoutRange={cur.score > 0 && cur.score <= MAX_VISIT}
                won={gameOver && state.winner !== null && state.players[state.winner] === cur}
              />
              {lastThrow && !gameOver && (
                <div key={lastThrow.id}
                     className="animate-riseFade pointer-events-none absolute left-1/2 top-3 -translate-x-1/2">
                  <span className={'font-score text-3xl tracking-widest ' + (lastThrow.bust ? 'text-red-400' : 'text-court-glow')}>
                    {lastThrow.bust ? 'BUST' : '−' + lastThrow.value}
                  </span>
                </div>
              )}
              <p className="mt-2 text-center text-[11px] text-slate-500">
                501 → land on <span className="font-bold text-slate-300">0</span> for a perfect checkout, or anywhere in
                <span className="font-bold text-slate-300"> 0 to {CHECKOUT_MIN}</span> to win. Below {CHECKOUT_MIN} is a bust.
              </p>
            </section>

            {/* Right: scoreboard + input + history */}
            <section className="flex flex-col gap-4">
              <div className={'flex gap-3 ' + (duel ? 'flex-col sm:flex-row' : '')}>
                {state.players.map((pl, i) => (
                  <PlayerPanel
                    key={i}
                    player={pl}
                    duel={duel}
                    active={i === state.turn}
                    gameOver={gameOver}
                    isWinner={state.winner === i}
                  />
                ))}
              </div>

              <div>
                {duel && !gameOver && (
                  <p className="mb-1.5 text-[11px] font-bold uppercase tracking-widest text-court-glow">
                    {cur.name} — your throw
                  </p>
                )}
                <PlayerSearch
                  onGuess={guess}
                  used={state.used}
                  disabled={gameOver}
                  placeholder={'Throw an NBA player… (over ' + MAX_VISIT + ' scores 0)'}
                />
                {msg && (
                  <p className={
                    'mt-2 flex items-start gap-1.5 text-xs leading-relaxed ' +
                    (msg.t === 'err' ? 'text-red-400' : msg.t === 'bust' ? 'text-red-300' : msg.t === 'good' ? 'text-emerald-300' : 'text-amber-300')
                  }>
                    <Info size={13} className="mt-0.5 shrink-0" /> <span>{msg.text}</span>
                  </p>
                )}
              </div>

              <div>
                <p className="mb-2 flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500">
                  <History size={11} /> Previous Throws
                </p>
                <HistoryList players={state.players} duel={duel} catShort={cat.short} />
              </div>
            </section>
          </div>

          {gameOver && (
            <EndModal mode={config.mode} cat={cat} state={state} onReplay={replay} onExit={onExit} />
          )}
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* Menu screen                                                         */
    /* ------------------------------------------------------------------ */
    function ModeButton({ active, onClick, icon: IconCmp, title, sub }) {
      return (
        <button onClick={onClick}
                className={'flex-1 rounded-2xl border p-4 text-left transition active:scale-[0.98] ' +
                  (active ? 'border-court/70 bg-court/10 shadow-glow' : 'border-line bg-panel hover:border-slate-600')}>
          <IconCmp size={20} className={active ? 'text-court-glow' : 'text-slate-400'} />
          <p className="mt-2 font-score text-xl tracking-wide text-white">{title}</p>
          <p className="text-[11px] leading-snug text-slate-500">{sub}</p>
        </button>
      );
    }

    function Menu({ onStart }) {
      const [mode, setMode] = useState('solo');           // 'solo' | 'duel' | 'daily'
      const [catChoice, setCatChoice] = useState(0);       // 0..2 or 'random'
      const [names, setNames] = useState(['Player 1', 'Player 2']);
      const [showRules, setShowRules] = useState(false);

      const dailyIdx = dailyCategoryIdx();
      const dailySaved = loadDaily();
      const dailyDone = dailySaved && dailySaved.state.status === 'over';
      const dailyInProgress = dailySaved && dailySaved.state.status === 'playing';

      const start = () => {
        if (mode === 'daily') {
          onStart({
            mode: 'daily',
            catIdx: dailySaved ? dailySaved.catIdx : dailyIdx,
            names: ['You'],
            saved: dailySaved ? dailySaved.state : null,
          });
          return;
        }
        const catIdx = catChoice === 'random' ? Math.floor(Math.random() * CATEGORIES.length) : catChoice;
        onStart({
          mode,
          catIdx,
          names: mode === 'duel'
            ? names.map((n, i) => n.trim() || 'Player ' + (i + 1))
            : ['You'],
          saved: null,
        });
      };

      return (
        <div className="mx-auto w-full max-w-3xl px-4 pb-12 pt-10 sm:px-6 sm:pt-14">
          {/* Hero */}
          <div className="text-center">
            <div className="mx-auto flex h-16 w-16 items-center justify-center rounded-3xl bg-court text-3xl shadow-glow">🏀</div>
            <h1 className="mt-4 font-score text-6xl tracking-[0.12em] text-white sm:text-7xl">HOOP DARTS</h1>
            <p className="mx-auto mt-1 max-w-md text-sm text-slate-400">
              <span className="font-bold text-court-glow">501</span> on the board. Throw NBA players — their career
              stats are your darts. Check out in the zone (<span className="text-slate-200">0 to −10</span>) to win.
            </p>
            <button onClick={() => setShowRules((s) => !s)}
                    className="mt-3 inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 transition hover:text-court-glow">
              <HelpCircle size={13} /> {showRules ? 'Hide rules' : 'How to play'}
            </button>
          </div>

          {showRules && (
            <div className="animate-pop mt-4 rounded-2xl border border-line bg-panel p-4 text-xs leading-relaxed text-slate-400 sm:p-5 sm:text-sm">
              <ul className="list-inside space-y-1.5">
                <li>🎯 You start at <b className="text-white">501</b>. Each turn, name an NBA player — their career stat in the active category is subtracted from your score.</li>
                <li>🧮 Every throw must be a <b className="text-white">possible 3-dart visit</b>. Anything over <b className="text-white">180</b> — or a bogey number (163, 166, 169, 172, 173, 175, 176, 178, 179) — scores <b className="text-red-300">0</b> and burns the throw. Westbrook's 203 triple-doubles? Worthless. 🚫</li>
                <li>🏆 Land on <b className="text-emerald-300">exactly 0</b> for a <b className="text-court-glow">Perfect Checkout</b>, or anywhere from <b className="text-white">0 down to −10</b> to win.</li>
                <li>💥 Dropping <b className="text-red-300">below −10</b> is a <b className="text-red-300">BUST</b>: your score resets to where the turn started and you lose one of your <b className="text-white">3 lives</b>. Lose all three and it's game over.</li>
                <li>🧱 A player with <b className="text-white">0</b> in the category still burns your throw — choose wisely.</li>
                <li>🔁 Each player can only be thrown <b className="text-white">once per game</b>.</li>
                <li>⚔️ In 1v1, you and a friend alternate throws on separate boards — first to check out (or survive the other's bust-out) wins.</li>
              </ul>
              <p className="mt-3 text-[10px] text-slate-600">Stat values are close approximations, tuned for gameplay.</p>
            </div>
          )}

          {/* Mode select */}
          <p className="mb-2 mt-8 text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500">Game Mode</p>
          <div className="flex flex-col gap-3 sm:flex-row">
            <ModeButton active={mode === 'solo'} onClick={() => setMode('solo')} icon={User}
                        title="SOLO 501" sub="Classic countdown. You vs. the board." />
            <ModeButton active={mode === 'duel'} onClick={() => setMode('duel')} icon={Swords}
                        title="1 V 1 DUEL" sub="Alternate throws with a friend. First checkout wins." />
            <ModeButton active={mode === 'daily'} onClick={() => setMode('daily')} icon={Calendar}
                        title="DAILY CHALLENGE"
                        sub={dailyDone ? 'Today: completed ✓ — view your result' : dailyInProgress ? 'Today: in progress — resume' : 'One board a day. No do-overs.'} />
          </div>

          {/* Duel names */}
          {mode === 'duel' && (
            <div className="animate-pop mt-4 grid gap-3 sm:grid-cols-2">
              {names.map((n, i) => (
                <div key={i}>
                  <label className="mb-1 block text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500">
                    Player {i + 1} name
                  </label>
                  <input
                    value={n}
                    maxLength={18}
                    onChange={(e) => setNames((prev) => prev.map((x, xi) => (xi === i ? e.target.value : x)))}
                    className="w-full rounded-xl border border-line bg-panel2 px-3.5 py-2.5 text-sm font-medium text-white outline-none transition focus:border-court/70 focus:ring-2 focus:ring-court/30"
                  />
                </div>
              ))}
            </div>
          )}

          {/* Category select */}
          {mode !== 'daily' ? (
            <div>
              <p className="mb-2 mt-6 text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500">Stat Category</p>
              <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
                {CATEGORIES.map((c, i) => (
                  <button key={c.id} onClick={() => setCatChoice(i)}
                          className={'rounded-xl border p-3 text-left transition active:scale-[0.97] ' +
                            (catChoice === i ? 'border-court/70 bg-court/10 shadow-glow' : 'border-line bg-panel hover:border-slate-600')}>
                    <span className="text-lg">{c.emoji}</span>
                    <p className="mt-1 font-score text-sm leading-tight tracking-wide text-white sm:text-base">{c.short.toUpperCase()}</p>
                  </button>
                ))}
                <button onClick={() => setCatChoice('random')}
                        className={'rounded-xl border p-3 text-left transition active:scale-[0.97] ' +
                          (catChoice === 'random' ? 'border-neon/70 bg-neon/10' : 'border-line bg-panel hover:border-slate-600')}>
                  <Shuffle size={18} className={catChoice === 'random' ? 'text-neon' : 'text-slate-400'} />
                  <p className="mt-1 font-score text-sm leading-tight tracking-wide text-white sm:text-base">RANDOM</p>
                </button>
              </div>
              <div className="mt-3 rounded-xl border border-line bg-panel p-3 text-[11px] leading-relaxed text-slate-400 sm:text-xs">
                {catChoice === 'random'
                  ? <span><b className="text-white">Random:</b> the board picks one of the {CATEGORIES.length} categories at tip-off.</span>
                  : <span><b className="text-white">{CATEGORIES[catChoice].name}.</b> {CATEGORIES[catChoice].desc}</span>}
              </div>
            </div>
          ) : (
            <div className="animate-pop mt-6 rounded-2xl border border-line bg-panel p-4">
              <p className="text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500">Today's locked category</p>
              <p className="mt-1 font-score text-2xl tracking-wide text-white">
                {CATEGORIES[dailySaved ? dailySaved.catIdx : dailyIdx].emoji}{' '}
                {CATEGORIES[dailySaved ? dailySaved.catIdx : dailyIdx].name}
              </p>
              <p className="mt-1 text-[11px] text-slate-500">
                One attempt per day. Your board is saved after every throw — refreshing won't undo a bust. 😉
              </p>
            </div>
          )}

          {/* Start */}
          <button onClick={start}
                  className="mt-8 flex w-full items-center justify-center gap-2 rounded-2xl bg-court py-4 font-score text-2xl tracking-[0.2em] text-ink shadow-glow transition hover:bg-court-glow active:scale-[0.98]">
            <Zap size={20} />
            {mode === 'daily' ? (dailyDone ? 'VIEW TODAY\'S RESULT' : dailyInProgress ? 'RESUME DAILY BOARD' : 'TIP OFF TODAY\'S BOARD') : 'TIP OFF'}
          </button>

          <p className="mt-6 text-center text-[10px] text-slate-600">
            {DBI ? DBI.count : ''} players in the SQL database · {CATEGORIES.length} stat categories · {DBI ? DBI.engine : ''}
          </p>
        </div>
      );
    }

    /* ------------------------------------------------------------------ */
    /* App root                                                            */
    /* ------------------------------------------------------------------ */
    function App() {
      const [config, setConfig] = useState(null);
      const [dbReady, setDbReady] = useState(false);
      useEffect(() => {
        let alive = true;
        initDB().then(() => { if (alive) setDbReady(true); });
        return () => { alive = false; };
      }, []);
      if (!dbReady) {
        return (
          <div className="flex min-h-screen flex-col items-center justify-center gap-3">
            <span className="flex h-14 w-14 animate-bounce items-center justify-center rounded-3xl bg-court text-2xl shadow-glow">🏀</span>
            <p className="font-score text-2xl tracking-[0.2em] text-white">HOOP DARTS</p>
            <p className="text-xs text-slate-500">loading the stat database…</p>
          </div>
        );
      }
      return (
        <div className="min-h-screen">
          {config
            ? <Game key={config.mode + '-' + config.catIdx + '-' + Date.now()} config={config} onExit={() => setConfig(null)} />
            : <Menu onStart={setConfig} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
